
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./Frontend-cross-platform/webfront
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
    ports:
      - "3001:3000"
    volumes:
      - ./Frontend-cross-platform/webfront:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_build:/app/.next

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_build:
