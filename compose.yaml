services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      # L'URL est construite à partir du .env : rien n'est écrit en dur ici
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    # Génère le client Prisma, applique les migrations existantes, puis lance Nest
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend-cross-platform/webfront
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3000"
    volumes:
      - ./Frontend-cross-platform/webfront:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_build:/app/.next
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ":?" = Docker refuse de démarrer si la variable est absente du .env
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
    # Accessible uniquement depuis ta machine (pas depuis le réseau).
    # Port côté PC configurable (5433 par défaut) pour éviter les conflits avec
    # un PostgreSQL déjà installé sur Windows. Le backend, lui, utilise toujours
    # postgres:5432 via le réseau interne de Docker.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_build:
  postgres_data: